<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kacper Clicker</title>
<style>
:root{--bg:#080a12;--panel:#111522;--panel2:#171b2b;--text:#f6f7fb;--muted:#9299ad;--accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399;--danger:#fb7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#201344 0,#080a12 38%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit}.app{display:grid;grid-template-columns:230px 1fr 330px;min-height:100vh}.side,.right{background:rgba(12,15,25,.84);backdrop-filter:blur(18px);border-right:1px solid #252a3b}.right{border-left:1px solid #252a3b;border-right:0;padding:22px}.brand{padding:24px;font-size:21px;font-weight:900}.brand span{color:var(--accent2)}nav{padding:8px 12px}nav button{width:100%;background:none;border:0;padding:12px 14px;text-align:left;border-radius:11px;color:var(--muted);cursor:pointer;margin:3px 0}nav button.active,nav button:hover{background:#1b2031;color:white}.main{padding:26px 34px;max-width:1000px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.badge{padding:7px 10px;border:1px solid #2d3348;background:#121626;border-radius:999px;color:#aeb6ca}.hero{background:linear-gradient(135deg,#17172b,#101728);border:1px solid #2a3045;border-radius:24px;padding:30px;box-shadow:0 18px 60px #0006}.eyebrow{color:var(--accent2);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:11px}.count{font-size:48px;font-weight:950;margin:8px 0}.rate{color:var(--muted)}.cookie{width:205px;height:205px;margin:25px auto;border-radius:50%;border:10px solid #c084fc;background:radial-gradient(circle,#d8b4fe,#8b5cf6);box-shadow:0 0 70px #8b5cf655,inset 0 0 25px #fff8;display:grid;place-items:center;font-size:80px;cursor:pointer;user-select:none;transition:.08s transform}.cookie:active{transform:scale(.94)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{background:#121625;border:1px solid #282e42;border-radius:16px;padding:17px}.card b{font-size:16px}.muted{color:var(--muted);line-height:1.5}.buy{margin-top:13px;width:100%;border:0;border-radius:10px;padding:10px;background:#262c42;cursor:pointer}.buy:hover{background:#343c58}.buy:disabled{opacity:.35;cursor:not-allowed}.right h3{margin-top:0}.stat{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #24293a}.tabs{display:flex;gap:8px;margin:18px 0}.tabs button{background:#111625;border:1px solid #292f43;padding:9px 12px;border-radius:10px;cursor:pointer}.tabs button.on{background:#2b2350;border-color:#7049cf}.toast{position:fixed;right:25px;bottom:25px;background:#191e2d;border:1px solid #363d55;border-radius:13px;padding:12px 15px;opacity:0;transform:translateY(10px);transition:.25s}.toast.show{opacity:1;transform:none}.ach{display:flex;gap:10px;align-items:center;margin:10px 0;padding:12px;background:#101421;border-radius:12px}.dot{width:10px;height:10px;border-radius:50%;background:#353b4e}.done .dot{background:var(--good)}@media(max-width:950px){.app{grid-template-columns:70px 1fr}.side{overflow:hidden}.brand{padding:20px 15px;font-size:0}.brand span{font-size:20px}.side nav button{font-size:0;text-align:center}.side nav button:first-letter{font-size:18px}.right{display:none}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.app{display:block}.side{position:sticky;top:0;z-index:5;border:0}.side nav{display:flex;overflow:auto}.side nav button{font-size:12px}.brand{display:none}.main{padding:16px}.grid{grid-template-columns:1fr}.count{font-size:38px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand">KACPER<span>CLICKER</span></div><nav id="nav">
<button class="active" data-page="clicker">◉ Clicker</button>
<button data-page="upgrades">⚡ Upgrades</button>
<button data-page="achievements">★ Achievements</button>
<button data-page="stats">▣ Statistics</button>
<button data-page="settings">⚙ Settings</button>
</nav></aside>

<main class="main">
<div class="top"><div><b id="pageTitle">Kacper Clicker</b><div class="muted">Build your empire, one click at a time.</div></div><div class="badge" id="prestigeBadge">Level 1</div></div>
<section id="content"></section>
</main>

<aside class="right">
<h3>Empire</h3>
<div class="stat"><span>Kacpers</span><b id="sideCount">0</b></div>
<div class="stat"><span>Per click</span><b id="sideClick">1</b></div>
<div class="stat"><span>Per second</span><b id="sideSec">0</b></div>
<div class="stat"><span>Clicks</span><b id="sideClicks">0</b></div>
<div style="height:18px"></div><h3>Next milestone</h3>
<div class="card"><b id="milestone">100 Kacpers</b><p class="muted" id="milestoneText">Keep clicking.</p></div>
</aside>
</div>
<div class="toast" id="toast"></div>
<script>
const saveKey='kacper_clicker_save_v1';
let s=JSON.parse(localStorage.getItem(saveKey)||'null')||{
k:0,clicks:0,perClick:1,perSec:0,level:1,total:0,
up:{cursor:0,auto:0,lab:0,quantum:0},settings:{compact:false}
};
const upgrades=[
{id:'cursor',name:'Kacper Cursor',desc:'+1 Kacper per click',base:15,scale:1.17,apply:()=>s.perClick+=1},
{id:'auto',name:'Auto Kacper',desc:'+1 Kacper per second',base:75,scale:1.22,apply:()=>s.perSec+=1},
{id:'lab',name:'Kacper Lab',desc:'+8 Kacpers per second',base:500,scale:1.27,apply:()=>s.perSec+=8},
{id:'quantum',name:'Quantum Kacper',desc:'+10 Kacpers per click',base:2500,scale:1.32,apply:()=>s.perClick+=10}
];
function cost(u){return Math.floor(u.base*Math.pow(u.scale,s.up[u.id]))}
function fmt(n){if(n<1000)return Math.floor(n).toLocaleString();let x=['K','M','B','T','Qa','Qi'];let i=-1;while(n>=1000&&i<x.length-1){n/=1000;i++}return n.toFixed(n<10?1:0)+x[i]}
function save(){localStorage.setItem(saveKey,JSON.stringify(s))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function clickK(){s.k+=s.perClick;s.clicks++;s.total+=s.perClick;checkLevel();save();render()}
function buy(id){let u=upgrades.find(x=>x.id===id),c=cost(u);if(s.k<c)return toast('Not enough Kacpers');s.k-=c;s.up[id]++;u.apply();toast(u.name+' purchased!');save();render()}
function checkLevel(){let next=Math.pow(10,s.level)*100;if(s.k>=next){s.level++;toast('Level up! You are now level '+s.level)}}
function contentClicker(){return `<div class="hero"><div class="eyebrow">Your Kacper Empire</div><div class="count" id="big">${fmt(s.k)} Kacpers</div><div class="rate">${fmt(s.perSec)} / sec • ${fmt(s.perClick)} / click</div><div class="cookie" onclick="clickK()">K</div><div class="muted" style="text-align:center">Click the K to generate Kacpers</div></div>
<div class="grid">${upgrades.slice(0,3).map(u=>card(u)).join('')}</div>`}
function card(u){let c=cost(u);return `<div class="card"><b>${u.name}</b><p class="muted">${u.desc}</p><div class="stat"><span>Owned</span><b>${s.up[u.id]}</b></div><button class="buy" onclick="buy('${u.id}')" ${s.k<c?'disabled':''}>Buy • ${fmt(c)}</button></div>`}
function page(p){let c=document.getElementById('content');if(p==='clicker')c.innerHTML=contentClicker();
if(p==='upgrades')c.innerHTML='<h2>Upgrades</h2><p class="muted">Invest in the machinery behind your Kacper production.</p><div class="grid">'+upgrades.map(card).join('')+'</div>';
if(p==='achievements'){let a=[['First Click',s.clicks>=1],['Kacper Collector',s.k>=100],['Kacper Tycoon',s.k>=10000],['Speed Demon',s.perSec>=25],['Click Machine',s.clicks>=1000],['Level 10',s.level>=10]];c.innerHTML='<h2>Achievements</h2>'+a.map(x=>`<div class="ach ${x[1]?'done':''}"><span class="dot"></span><div><b>${x[0]}</b><div class="muted">${x[1]?'Unlocked!':'Locked achievement'}</div></div></div>`).join('')}
if(p==='stats')c.innerHTML=`<h2>Statistics</h2><div class="grid"><div class="card"><b>Total earned</b><p class="count">${fmt(s.total)}</p></div><div class="card"><b>Total clicks</b><p class="count">${fmt(s.clicks)}</p></div><div class="card"><b>Level</b><p class="count">${s.level}</p></div></div>`;
if(p==='settings')c.innerHTML=`<h2>Settings</h2><div class="card"><b>Save data</b><p class="muted">Progress is stored automatically in your browser.</p><button class="buy" onclick="save();toast('Saved!')">Save now</button><button class="buy" onclick="if(confirm('Reset all progress?')){localStorage.removeItem(saveKey);location.reload()}">Reset progress</button></div>`;
document.getElementById('pageTitle').textContent=p[0].toUpperCase()+p.slice(1)}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');page(b.dataset.page)});
function render(){let active=document.querySelector('#nav button.active').dataset.page;page(active);document.getElementById('sideCount').textContent=fmt(s.k);document.getElementById('sideClick').textContent=fmt(s.perClick);document.getElementById('sideSec').textContent=fmt(s.perSec);document.getElementById('sideClicks').textContent=fmt(s.clicks);document.getElementById('prestigeBadge').textContent='Level '+s.level;let m=Math.pow(10,s.level)*100;document.getElementById('milestone').textContent=fmt(m)+' Kacpers';document.getElementById('milestoneText').textContent=fmt(Math.max(0,m-s.k))+' remaining'}
setInterval(()=>{if(s.perSec){s.k+=s.perSec;s.total+=s.perSec;checkLevel();save();render()}},1000);
render();
</script>
</body>
</html>
