<body>

<div id="game"></div>

<div id="startScreen">
    <div class="startBox">
        <h1>VOID<span>CRAFT</span></h1>
        <div class="subtitle">VOXEL SURVIVAL PROTOCOL // 0.1</div>

        <button class="startButton" id="startButton">
            INITIALIZE WORLD
        </button>

        <div class="hint">
            W A S D &nbsp; // &nbsp; MOUSE &nbsp; // &nbsp; SPACE &nbsp; // &nbsp; ESC
        </div>
    </div>
</div>

<div id="loading">GENERATING TERRAIN...</div>

<div class="hud">
    <div class="topbar">
        <div class="logo">VOIDCRAFT <span>// ONLINE</span></div>
        <div class="stats">
            SECTOR 07 &nbsp;|&nbsp; FPS <span id="fps">60</span>
        </div>
    </div>

    <div class="crosshair"></div>

    <div id="blockName">GRASS</div>

    <div class="bottom">
        <div class="controls">
            WASD MOVE &nbsp; • &nbsp; SPACE JUMP &nbsp; • &nbsp; LMB MINE &nbsp; • &nbsp; RMB BUILD
        </div>

        <div class="hotbar">
            <div class="slot selected" data-key="1" data-block="grass">
                <div class="block-icon grass"></div>
            </div>

            <div class="slot" data-key="2" data-block="dirt">
                <div class="block-icon dirt"></div>
            </div>

            <div class="slot" data-key="3" data-block="stone">
                <div class="block-icon stone"></div>
            </div>

            <div class="slot" data-key="4" data-block="glass">
                <div class="block-icon glass"></div>
            </div>

            <div class="slot" data-key="5" data-block="glow">
                <div class="block-icon glow"></div>
            </div>

            <div class="slot" data-key="6" data-block="metal">
                <div class="block-icon metal"></div>
            </div>

            <div class="slot" data-key="7" data-block="leaves">
                <div class="block-icon leaves"></div>
            </div>
        </div>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

import { PointerLockControls } from
"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/PointerLockControls.js";

/* -------------------------
   SCENE
------------------------- */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07111c);

scene.fog = new THREE.FogExp2(
    0x07111c,
    0.018
);

/* -------------------------
   CAMERA
------------------------- */

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth / innerHeight,
    .1,
    500
);

camera.position.set(0, 8, 15);

/* -------------------------
   RENDERER
------------------------- */

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document
    .getElementById("game")
    .appendChild(renderer.domElement);

/* -------------------------
   LIGHTING
------------------------- */

const ambient = new THREE.HemisphereLight(
    0x8de8ff,
    0x182030,
    1.8
);

scene.add(ambient);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

sun.position.set(80,120,40);
sun.castShadow = true;

sun.shadow.mapSize.set(2048,2048);

scene.add(sun);

/* -------------------------
   MATERIALS
------------------------- */

const materials = {

    grass: new THREE.MeshStandardMaterial({
        color: 0x4caf55,
        roughness: .9
    }),

    dirt: new THREE.MeshStandardMaterial({
        color: 0x795331,
        roughness: 1
    }),

    stone: new THREE.MeshStandardMaterial({
        color: 0x69737d,
        roughness: .85
    }),

    glass: new THREE.MeshPhysicalMaterial({
        color: 0x38d9ff,
        transparent: true,
        opacity: .35,
        roughness: .05,
        metalness: .1
    }),

    glow: new THREE.MeshStandardMaterial({
        color: 0xb83dff,
        emissive: 0x7d18c7,
        emissiveIntensity: 2.5
    }),

    metal: new THREE.MeshStandardMaterial({
        color: 0x788791,
        metalness: .85,
        roughness: .25
    }),

    leaves: new THREE.MeshStandardMaterial({
        color: 0x237849,
        roughness: 1
    })
};

/* -------------------------
   VOXEL WORLD
------------------------- */

const world = [];

const cubeGeometry = new THREE.BoxGeometry(1,1,1);

function addBlock(x,y,z,type) {

    const mesh = new THREE.Mesh(
        cubeGeometry,
        materials[type] || materials.grass
    );

    mesh.position.set(
        x + .5,
        y + .5,
        z + .5
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    mesh.userData.block = type;
    mesh.userData.grid = {x,y,z};

    scene.add(mesh);
    world.push(mesh);

    return mesh;
}

/* Simple deterministic terrain */

function terrainHeight(x,z) {

    const a =
        Math.sin(x * .35) * 1.8;

    const b =
        Math.cos(z * .28) * 1.6;

    const c =
        Math.sin((x+z) * .13) * 2.2;

    return Math.max(
        1,
        Math.floor(4 + a + b + c)
    );
}

function generateWorld() {

    const size = 42;

    for(let x=-size;x<=size;x++) {

        for(let z=-size;z<=size;z++) {

            const h = terrainHeight(x,z);

            for(let y=0;y<=h;y++) {

                let type = "stone";

                if(y === h)
                    type = "grass";

                else if(y > h-3)
                    type = "dirt";

                addBlock(x,y,z,type);
            }

            /* Occasional alien crystals */

            if(
                Math.random() < .015 &&
                h > 3
            ) {

                addBlock(
                    x,
                    h+1,
                    z,
                    "glow"
                );

                addBlock(
                    x,
                    h+2,
                    z,
                    "glow"
                );
            }
        }
    }

    /* Floating structures */

    for(let i=0;i<18;i++) {

        const x =
            Math.floor(Math.random()*60)-30;

        const z =
            Math.floor(Math.random()*60)-30;

        const y =
            Math.floor(Math.random()*10)+12;

        addBlock(x,y,z,"metal");
        addBlock(x+1,y,z,"metal");
        addBlock(x,y,z+1,"metal");
        addBlock(x+1,y,z+1,"metal");
    }
}

/* -------------------------
   CONTROLS
------------------------- */

const controls =
    new PointerLockControls(
        camera,
        document.body
    );

scene.add(controls.object);

const keys = {};

let velocityY = 0;
let canJump = false;

document.addEventListener(
    "keydown",
    e => {

        keys[e.code] = true;

        if(
            e.code === "Space" &&
            canJump
        ) {

            velocityY = 10;
            canJump = false;
        }

        if(e.key >= "1" && e.key <= "7") {

            const index =
                Number(e.key)-1;

            document
                .querySelectorAll(".slot")
                [index]
                ?.click();
        }
    }
);

document.addEventListener(
    "keyup",
    e => {
        keys[e.code] = false;
    }
);

/* -------------------------
   HOTBAR
------------------------- */

let selectedBlock = "grass";

document
.querySelectorAll(".slot")
.forEach(slot => {

    slot.addEventListener("click", () => {

        document
        .querySelectorAll(".slot")
        .forEach(s =>
            s.classList.remove("selected")
        );

        slot.classList.add("selected");

        selectedBlock =
            slot.dataset.block;

        document
            .getElementById("blockName")
            .textContent =
            selectedBlock.toUpperCase();
    });
});

/* -------------------------
   RAYCASTING
------------------------- */

const raycaster = new THREE.Raycaster();

const center =
    new THREE.Vector2(0,0);

function getTarget() {

    raycaster.setFromCamera(
        center,
        camera
    );

    const hits =
        raycaster.intersectObjects(
            world,
            false
        );

    return hits[0];
}

/* Mine block */

document.addEventListener(
    "mousedown",
    e => {

        if(!controls.isLocked)
            return;

        const hit = getTarget();

        if(!hit)
            return;

        const block = hit.object;

        if(e.button === 0) {

            scene.remove(block);

            const index =
                world.indexOf(block);

            if(index !== -1)
                world.splice(index,1);
        }

        if(e.button === 2) {

            const normal =
                hit.face.normal.clone();

            const pos =
                block.position.clone()
                .subScalar(.5)
                .add(normal);

            addBlock(
                Math.floor(pos.x),
                Math.floor(pos.y),
                Math.floor(pos.z),
                selectedBlock
            );
        }
    }
);

document.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);

/* -------------------------
   START GAME
------------------------- */

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

startButton.addEventListener(
    "click",
    () => {

        startScreen.style.display =
            "none";

        document.getElementById(
            "loading"
        ).style.display =
            "flex";

        setTimeout(() => {

            generateWorld();

            document.getElementById(
                "loading"
            ).style.display =
                "none";

            controls.lock();

        }, 200);
    }
);

/* -------------------------
   GAME LOOP
------------------------- */

let lastTime = performance.now();
let frames = 0;
let fpsTimer = 0;

function animate() {

    requestAnimationFrame(animate);

    const now =
        performance.now();

    const delta =
        Math.min(
            (now-lastTime)/1000,
            .05
        );

    lastTime = now;

    /* FPS */

    frames++;
    fpsTimer += delta;

    if(fpsTimer >= 1) {

        document
            .getElementById("fps")
            .textContent = frames;

        frames = 0;
        fpsTimer = 0;
    }

    if(controls.isLocked) {

        const speed = 9;

        if(keys["KeyW"])
            controls.moveForward(
                speed * delta
            );

        if(keys["KeyS"])
            controls.moveForward(
                -speed * delta
            );

        if(keys["KeyA"])
            controls.moveRight(
                -speed * delta
            );

        if(keys["KeyD"])
            controls.moveRight(
                speed * delta
            );

        /* Gravity */

        velocityY -=
            25 * delta;

        camera.position.y +=
            velocityY * delta;

        if(camera.position.y < 7) {

            camera.position.y = 7;
            velocityY = 0;
            canJump = true;
        }

        /* Prevent falling forever */

        if(camera.position.y < -20) {

            camera.position.set(
                0,15,0
            );

            velocityY = 0;
        }
    }

    /* Slowly move sun for atmosphere */

    const t =
        performance.now() * .00005;

    sun.position.x =
        Math.cos(t)*120;

    sun.position.z =
        Math.sin(t)*120;

    renderer.render(
        scene,
        camera
    );
}

animate();

/* -------------------------
   RESIZE
------------------------- */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth / innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
