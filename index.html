<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Kacper Roast</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #111, #3b0a0a);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 25px;
      padding: 45px 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 60px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #ff7777;
      font-size: 20px;
      margin-bottom: 35px;
    }

    .roast {
      background: #1d1d1d;
      border-radius: 18px;
      padding: 30px;
      font-size: 25px;
      line-height: 1.5;
      min-height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    button {
      border: none;
      background: #ff3131;
      color: white;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #ff5555;
      transform: scale(1.05);
    }

    .stats {
      margin-top: 35px;
      display: flex;
      justify-content: space-around;
      gap: 15px;
    }

    .stat {
      background: #191919;
      padding: 20px;
      border-radius: 15px;
      flex: 1;
    }

    .stat h2 {
      color: #ff4444;
      font-size: 30px;
    }

    .stat p {
      color: #aaa;
      margin-top: 5px;
    }

    footer {
      margin-top: 30px;
      color: #777;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 42px;
      }

      .stats {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🔥 KACPER.EXE 🔥</h1>

    <p class="subtitle">
      The official investigation into how bro is still functioning
    </p>

    <div class="roast" id="roast">
      Click the button to generate a roast 💀
    </div>

    <button onclick="newRoast()">
      ROAST KACPER
    </button>

    <div class="stats">
      <div class="stat">
        <h2>0%</h2>
        <p>Common Sense</p>
      </div>

      <div class="stat">
        <h2>100%</h2>
        <p>Confidence</p>
      </div>

      <div class="stat">
        <h2>∞</h2>
        <p>Yapping</p>
      </div>
    </div>

    <footer>
      This website is a joke. Kacper is allegedly a real person.
    </footer>

  </div>

  <script>
    const roasts = [
      "Kacper has the confidence of someone who has never checked his own decisions.",
      "Bro's Wi-Fi signal has more stability than his arguments.",
      "Kacper could lose an argument with a loading screen.",
      "If procrastination was an Olympic sport, Kacper would say he'd compete tomorrow.",
      "Kacper doesn't need enemies. His decision-making has got him covered.",
      "Bro opened the settings menu and still couldn't find common sense.",
      "Kacper's brain is running on the free trial version.",
      "Scientists have studied Kacper for years and still haven't found the point.",
      "Kacper's biggest achievement is somehow making autocorrect give up.",
      "Bro has unlimited confidence and absolutely no patch notes."
    ];

    function newRoast() {
      const roastBox = document.getElementById("roast");

      const randomIndex = Math.floor(Math.random() * roasts.length);

      roastBox.textContent = roasts[randomIndex];
    }
  </script>

</body>
</html>
